apiVersion: apps/v1
kind: Deployment
metadata:
  name: gosubs
  labels:
    app.kubernetes.io/name: gosubs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gosubs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gosubs
    spec:
      containers:
        - name: gosubs
          image: __GOSUBS_CONTAINER_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - secretRef:
                name: gosubs-env
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 72
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
