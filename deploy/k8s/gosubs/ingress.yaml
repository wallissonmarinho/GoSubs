apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gosubs
  namespace: gosubs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gosubs.duckdns.org
      secretName: gosubs-tls
  rules:
    - host: gosubs.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gosubs
                port:
                  number: 8090
